# Tiny config for smoke test / CI (CPU, seconds).
data:
  root: data/nuscenes
  n_cams: 4
  image_h: 64
  image_w: 96
  xbound: [-20.0, 20.0, 1.0]
  ybound: [-20.0, 20.0, 1.0]
  zbound: [-5.0, 5.0, 10.0]
